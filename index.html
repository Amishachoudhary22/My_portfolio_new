<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Amisha Choudhary — Outbound</title>
<meta name="description" content="Amisha Choudhary — DevOps & Cloud/GenAI Engineer. A continuous flight through everything I have built.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Space+Grotesk:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --void:#03050e;
  --ink:#eef2ff;
  --ink-dim:#8790b6;
  --cyan:#7ee7ff;
  --cyan-dim:rgba(126,231,255,.3);
  --hair:rgba(126,231,255,.18);
  --mono:'Share Tech Mono',monospace;
  --body:'Space Grotesk',sans-serif;
  --display:'Michroma',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:auto;scroll-snap-type:y mandatory}
body{background:var(--void);color:var(--ink);font-family:var(--body);
  background-image:
    radial-gradient(ellipse 60% 50% at 82% 10%, rgba(120,90,230,.14), transparent 60%),
    radial-gradient(ellipse 55% 60% at 8% 90%, rgba(30,110,180,.13), transparent 60%),
    linear-gradient(180deg,#04061a,#03050e 60%,#05081a);
  background-attachment:fixed;overflow-x:hidden;}

/* scroll length is built from one full-height snap panel per sector (added by JS).
   scroll-snap-stop:always makes every destination a hard stop — no skipping. */
#track{position:relative;width:100%;z-index:0}
.panel{height:100vh;scroll-snap-align:start;scroll-snap-stop:always}

canvas#space{position:fixed;inset:0;z-index:1;display:block}
/* the craft renders on its own layer, above the colour tint, so it keeps its true colours */
canvas#ufo{position:fixed;inset:0;z-index:4;pointer-events:none;display:block}

/* cinematic vignette */
#vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse 78% 78% at 50% 46%, transparent 55%, rgba(3,5,14,.62) 100%)}
/* per-region colour wash — set by JS, kept soft so text stays readable */
#tint{position:fixed;inset:0;z-index:3;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(125% 108% at 50% 44%, var(--tint,transparent) 0%, transparent 70%)}
#flash{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .55s ease;mix-blend-mode:screen}

/* ---------- boot ---------- */
#loader{position:fixed;inset:0;z-index:80;background:var(--void);display:flex;align-items:center;
  justify-content:center;transition:opacity .8s ease;font-family:var(--mono)}
#loader.done{opacity:0;pointer-events:none}
.boot{width:min(440px,86vw)}
.b-l{color:var(--ink-dim);font-size:12.5px;letter-spacing:.06em;margin:6px 0;opacity:0;animation:bi .3s forwards}
.b-l b{color:var(--cyan);font-weight:normal}.b-l.ok::after{content:' ✓';color:#7dffb0}
.b-bar{height:2px;background:rgba(126,231,255,.12);margin-top:16px;overflow:hidden}
.b-bar i{display:block;height:100%;width:0;background:var(--cyan);animation:bl 1.6s .2s ease forwards}
@keyframes bi{to{opacity:1}}@keyframes bl{to{width:100%}}

/* ---------- reticle ---------- */
.tick{position:fixed;width:15px;height:15px;z-index:20;pointer-events:none;opacity:.4}
.tick::before,.tick::after{content:'';position:absolute;background:var(--cyan)}
.tick::before{width:100%;height:1px}.tick::after{width:1px;height:100%}
.tick.tl{top:12px;left:12px}.tick.tr{top:12px;right:12px;transform:scaleX(-1)}
.tick.bl{bottom:12px;left:12px;transform:scaleY(-1)}.tick.br{bottom:12px;right:12px;transform:scale(-1)}

/* ---------- HUD ---------- */
/* ---------- top nav ---------- */
.hud{position:fixed;z-index:20;font-family:var(--mono);pointer-events:none}
.hud *{pointer-events:auto}
#hud-top{top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:12px 20px;
  background:linear-gradient(180deg, rgba(3,5,14,.82) 0%, rgba(3,5,14,.4) 60%, transparent 100%)}
.brand{background:none;border:none;cursor:pointer;text-align:left;padding:0;flex-shrink:0;line-height:1}
.brand .n{font-family:var(--display);font-size:13px;letter-spacing:.18em;color:var(--ink);display:block}
.brand .r{font-size:9px;letter-spacing:.22em;color:var(--cyan);margin-top:5px;display:block}
.brand:hover .n{color:var(--cyan)}

.topnav{display:flex;gap:1px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.topnav::-webkit-scrollbar{display:none}
.navlink{font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--ink-dim);background:none;border:none;
  cursor:pointer;padding:7px 10px;white-space:nowrap;transition:color .2s;position:relative}
.navlink:hover{color:var(--ink)}
.navlink.on{color:var(--cyan)}
.navlink.on::after{content:'';position:absolute;left:10px;right:10px;bottom:2px;height:1px;background:var(--cyan);box-shadow:0 0 7px rgba(126,231,255,.7)}

.toputil{display:flex;align-items:center;gap:9px;flex-shrink:0}
.util-res{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--cyan);text-decoration:none;
  border:1px solid var(--cyan-dim);padding:7px 12px;border-radius:20px;background:rgba(126,231,255,.05);transition:all .2s;white-space:nowrap}
.util-res:hover{background:rgba(126,231,255,.14);box-shadow:0 0 16px rgba(126,231,255,.3)}
.util-ic{width:30px;height:30px;border-radius:50%;border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:#cfe9f4;text-decoration:none;transition:all .2s}
.util-ic svg{width:15px;height:15px;fill:currentColor;display:block}
.util-ic:hover{color:var(--cyan);border-color:var(--cyan-dim);box-shadow:0 0 14px rgba(126,231,255,.28)}

/* progress rail */
#rail{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:20;
  display:flex;flex-direction:column;align-items:center;gap:0;pointer-events:none}
#rail *{pointer-events:auto}
.rail-line{position:relative;width:2px;height:min(46vh,360px);background:rgba(126,231,255,.14);border-radius:2px;overflow:hidden}
.rail-fill{position:absolute;top:0;left:0;width:100%;height:0;background:linear-gradient(var(--cyan),rgba(126,231,255,.4));box-shadow:0 0 10px rgba(126,231,255,.5)}
.rail-marks{position:absolute;inset:0}
.rm{position:absolute;left:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;
  border:1px solid var(--cyan-dim);background:var(--void);cursor:pointer;transition:transform .2s,background .2s,border-color .2s}
.rm:hover{transform:translate(-50%,-50%) scale(1.4);border-color:var(--cyan)}
.rm.active{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(126,231,255,.7)}
.rm .rl{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:8.5px;letter-spacing:.14em;
  color:var(--ink-dim);white-space:nowrap;opacity:0;transition:opacity .2s;text-align:right}
.rm:hover .rl,.rm.active .rl{opacity:1;color:var(--cyan)}

/* ---------- flight sections ---------- */
#sections{position:fixed;inset:0;z-index:10;pointer-events:none}
.sect{position:absolute;inset:0;display:flex;padding:96px 26px 120px;opacity:0;will-change:opacity,transform}
.sect.al-left{align-items:center;justify-content:flex-start}
.sect.al-right{align-items:center;justify-content:flex-end}
.sect.al-center{align-items:center;justify-content:center}
.wrap{max-width:500px;pointer-events:none;padding:26px 30px;border-radius:18px;position:relative;isolation:isolate}
.sect.al-center .wrap{max-width:640px;text-align:center}

/* ---- transmission reveal ---- */
/* 1. the panel scrim lives on ::before so it can OPEN like a scroll, independent of the text */
.wrap::before{content:'';position:absolute;inset:0;border-radius:18px;z-index:-1;
  background:radial-gradient(125% 120% at 28% 30%, rgba(4,7,20,.74), rgba(4,7,20,.36) 66%, transparent 100%);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  transform:scaleY(.03);opacity:0;transform-origin:center;
  transition:transform .5s cubic-bezier(.2,.85,.2,1),opacity .32s ease}
.sect.al-center .wrap::before{background:radial-gradient(120% 120% at 50% 42%, rgba(4,7,20,.7), rgba(4,7,20,.3) 66%, transparent 100%)}
.sect.al-right .wrap::before{background:radial-gradient(125% 120% at 72% 30%, rgba(4,7,20,.74), rgba(4,7,20,.36) 66%, transparent 100%)}
.sect.show .wrap::before{transform:scaleY(1);opacity:1}

/* 2. a bright channel line sweeps open horizontally as the panel finishes opening */
.wrap::after{content:'';position:absolute;left:30px;right:30px;top:14px;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan) 20%,var(--cyan) 80%,transparent);
  box-shadow:0 0 10px rgba(126,231,255,.6);
  transform:scaleX(0);opacity:0;transform-origin:center;
  transition:transform .55s cubic-bezier(.2,.8,.2,1) .18s,opacity .4s ease .18s}
.sect.show .wrap::after{transform:scaleX(1);opacity:.85}

/* 3. then each line materialises, staggered by its own --d */
.wrap > *{opacity:0;transform:translateY(12px);
  transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1)}
.sect.show .wrap > *{opacity:1;transform:none;transition-delay:var(--d,0s)}
.pts li{opacity:0;transform:translateX(-10px);transition:opacity .5s ease,transform .5s ease}
.sect.show .pts li{opacity:1;transform:none;transition-delay:var(--d,0s)}
.grid2 .gcol{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.sect.show .grid2 .gcol{opacity:1;transform:none;transition-delay:var(--d,0s)}
.chips span{opacity:0;transform:translateY(8px) scale(.96);transition:opacity .4s ease,transform .4s ease}
.sect.show .chips span{opacity:1;transform:none;transition-delay:var(--d,0s)}

.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.36em;color:var(--cyan);margin-bottom:16px;
  filter:drop-shadow(0 0 8px rgba(126,231,255,.5))}
.big{font-family:var(--display);letter-spacing:.06em;line-height:1.2;text-shadow:0 0 44px rgba(126,231,255,.4)}
.al-center .big{font-size:clamp(30px,6.4vw,64px);letter-spacing:.12em}
.big{font-size:clamp(22px,3.8vw,36px)}
.role{font-family:var(--mono);font-size:clamp(10px,1.4vw,13px);letter-spacing:.28em;color:var(--cyan);margin-top:16px}
.sub{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-dim);margin-top:14px;line-height:1.7}
.note{font-size:14.5px;font-weight:300;color:#d3d9f2;margin-top:18px;line-height:1.7;max-width:480px}
.al-center .note{margin-left:auto;margin-right:auto}

.pts{list-style:none;margin-top:20px}
.pts li{font-size:13px;font-weight:400;line-height:1.6;color:#d3dcf5;padding:7px 0 7px 18px;position:relative}
.pts li::before{content:'▸';position:absolute;left:0;top:8px;color:var(--cyan);font-size:10px}
.pts li b{color:var(--ink);font-weight:500}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;margin-top:18px;text-align:left}
.gcol .gh{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--cyan);margin-bottom:7px;opacity:.9}
.gcol ul{list-style:none}
.gcol li{font-size:12px;font-weight:300;color:#c4cbe8;line-height:1.55;padding:3px 0 3px 12px;position:relative}
.gcol li::before{content:'·';position:absolute;left:2px;color:var(--cyan-dim)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;justify-content:center}
.chips span{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:#bfe9f6;border:1px solid var(--hair);
  padding:5px 9px;border-radius:2px;background:rgba(126,231,255,.05)}

/* ---------- categorized skills ---------- */
.skcats{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.skcat{display:flex;align-items:flex-start;gap:12px;text-align:left}
.skcat-h{flex:0 0 92px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--cyan);text-align:right;padding-top:6px;line-height:1.3}
.skchips{display:flex;flex-wrap:wrap;gap:5px;flex:1;justify-content:flex-start}
.skchips span{font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;color:#c6ecf5;border:1px solid var(--hair);
  padding:4px 8px;border-radius:3px;background:rgba(126,231,255,.05)}
.dock-note{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--ink-dim);margin-top:14px}

/* ---------- project cards ---------- */
.projs{margin-top:18px;display:flex;flex-direction:column;gap:11px}
.proj{border:1px solid var(--hair);border-radius:10px;padding:12px 14px;background:rgba(126,231,255,.035);transition:border-color .2s,background .2s}
.proj:hover{border-color:var(--cyan-dim);background:rgba(126,231,255,.07)}
.proj-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.proj-n{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;color:var(--ink)}
.proj-l{display:flex;gap:10px;flex-shrink:0}
.proj-l a{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--cyan);text-decoration:none;opacity:.85;transition:opacity .2s,text-shadow .2s}
.proj-l a:hover{opacity:1;text-shadow:0 0 8px rgba(126,231,255,.6)}
.proj-b{font-size:12.5px;font-weight:300;line-height:1.5;color:#cdd6f0;margin-top:6px}
.proj-b b{color:var(--ink);font-weight:500}
.proj-t{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-dim);margin-top:7px}

/* ---------- start over ---------- */
.restart{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:#cfe9f4;background:rgba(126,231,255,.05);
  border:1px solid var(--hair);padding:11px 18px;border-radius:24px;cursor:pointer;margin-top:22px;transition:all .2s}
.restart:hover{color:var(--cyan);border-color:var(--cyan-dim);box-shadow:0 0 22px rgba(126,231,255,.28)}

.links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px;pointer-events:auto}
.links a{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:#cfe9f4;text-decoration:none;
  border:1px solid var(--hair);padding:11px 16px;border-radius:3px;background:rgba(126,231,255,.05);
  opacity:0;transform:translateY(10px);
  transition:opacity .5s ease,transform .5s ease,color .2s,border-color .2s,box-shadow .2s}
.sect.show .links a{opacity:1;transform:none;transition-delay:var(--d,0s)}
.links a:hover,.links a:focus-visible{color:var(--cyan);border-color:var(--cyan-dim);box-shadow:0 0 22px rgba(126,231,255,.28)}
.links a::before{content:'▸ ';color:var(--cyan-dim)}

/* ---------- contact form ---------- */
.cform{display:flex;flex-direction:column;gap:9px;max-width:420px;margin:18px auto 4px;text-align:left}
.cf{font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--ink);width:100%;
  background:rgba(126,231,255,.05);border:1px solid var(--hair);border-radius:7px;padding:11px 13px;outline:none;
  transition:border-color .2s,box-shadow .2s;resize:vertical}
.cf::placeholder{color:var(--ink-dim);letter-spacing:.1em}
.cf:focus{border-color:var(--cyan-dim);box-shadow:0 0 18px rgba(126,231,255,.2)}
textarea.cf{min-height:64px;line-height:1.5}
.cf-send{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--void);font-weight:600;
  background:var(--cyan);border:none;border-radius:7px;padding:12px 16px;cursor:pointer;margin-top:2px;
  transition:filter .2s,box-shadow .2s;box-shadow:0 0 20px rgba(126,231,255,.35)}
.cf-send:hover{filter:brightness(1.08);box-shadow:0 0 28px rgba(126,231,255,.5)}
.cf-send:disabled{opacity:.55;cursor:default;box-shadow:none;filter:none}
.cf-status{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;min-height:14px;text-align:center;color:var(--ink-dim)}
.cf-status.ok{color:#7dffb0}.cf-status.err{color:#ff8f8f}

/* ---------- scroll hint ---------- */
#hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:20;font-family:var(--mono);
  font-size:10px;letter-spacing:.22em;color:var(--ink-dim);text-align:center;transition:opacity .5s;pointer-events:none}
#hint .arw{display:block;margin:8px auto 0;width:16px;height:16px;border-right:1px solid var(--cyan);
  border-bottom:1px solid var(--cyan);transform:rotate(45deg);animation:bounce 1.8s infinite}
@keyframes bounce{0%,100%{transform:rotate(45deg) translate(0,0);opacity:.5}50%{transform:rotate(45deg) translate(3px,3px);opacity:1}}

/* ---------- sound ---------- */
#sound{position:fixed;left:16px;bottom:22px;z-index:22;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  color:var(--ink-dim);background:rgba(8,13,30,.55);border:1px solid var(--hair);padding:8px 12px;border-radius:20px;
  cursor:pointer;display:flex;align-items:center;gap:8px;backdrop-filter:blur(6px);transition:color .2s,border-color .2s}
#sound:hover,#sound.on{color:var(--cyan);border-color:var(--cyan-dim)}
#sound .ic{width:8px;height:8px;border-radius:50%;background:currentColor}
#sound.on .ic{animation:sonar 1.6s infinite}
#sound.pulse{animation:hp 2.2s infinite}
@keyframes sonar{0%{box-shadow:0 0 0 0 rgba(126,231,255,.5)}100%{box-shadow:0 0 0 11px rgba(126,231,255,0)}}
@keyframes hp{0%,100%{border-color:var(--hair)}50%{border-color:var(--cyan);box-shadow:0 0 14px rgba(126,231,255,.3)}}

:focus-visible{outline:1px solid var(--cyan);outline-offset:3px}

/* opening panel — narrower, shorter and dropped lower so the projector craft has room above it */
.sect-title .wrap{max-width:560px;padding:22px 26px;transform:translateY(8vh)}
.sect-title.al-center .big{font-size:clamp(28px,5.2vw,52px)}
.sect-title .eyebrow{margin-bottom:12px}
.sect-title .note{margin-top:14px}

/* ---------- responsive ---------- */
@media (max-width:760px){
  #hud-top{gap:8px;padding:10px 12px}
  .brand .n{font-size:11px;letter-spacing:.12em}
  .brand .r{display:none}
  .topnav{justify-content:flex-start}
  .navlink{font-size:9.5px;padding:6px 8px}
  .util-res{padding:6px 9px;font-size:9px}
  .util-ic{width:26px;height:26px;font-size:9px}
  .sect{padding:84px 18px 150px;align-items:flex-end!important;justify-content:center!important}
  .wrap,.sect.al-center .wrap{max-width:none;text-align:center}
  .sect-title .wrap{transform:none}
  .grid2{grid-template-columns:1fr;gap:12px}
  .skcat{flex-direction:column;gap:3px}
  .skcat-h{flex:none;text-align:center;padding-top:0}
  .skchips{justify-content:center}
  .pts{display:inline-block;text-align:left}
  #rail{right:10px}
  .rail-line{height:min(38vh,300px)}
  .rm .rl{display:none}
  #hint{bottom:66px}
  #sound{bottom:104px;font-size:9px;padding:7px 10px}
}
@media (prefers-reduced-motion:reduce){
  #hint .arw{animation:none}
  .wrap > *,.pts li,.grid2 .gcol,.chips span,.links a{opacity:1;transform:none;transition:none}
  .wrap::before{transform:scaleY(1);opacity:1;transition:none}
  .wrap::after{transform:scaleX(1);opacity:.85;transition:none}
}
</style>
</head>
<body>

<div id="track"></div>

<div id="loader" role="status" aria-label="Loading">
  <div class="boot">
    <div class="b-l" style="animation-delay:.05s"><b>FLIGHT COMPUTER</b> initializing</div>
    <div class="b-l ok" style="animation-delay:.35s"><b>NAV</b> flight path plotted · 8 sectors</div>
    <div class="b-l ok" style="animation-delay:.7s"><b>PROP</b> drives online · throttle = scroll</div>
    <div class="b-l" style="animation-delay:1.05s"><b>PILOT</b> A. CHOUDHARY · cleared for departure</div>
    <div class="b-bar"><i></i></div>
  </div>
</div>

<canvas id="space"></canvas>
<div id="vignette"></div>
<div id="tint"></div>
<canvas id="ufo"></canvas>
<div id="flash"></div>

<div class="tick tl"></div><div class="tick tr"></div><div class="tick bl"></div><div class="tick br"></div>

<header class="hud" id="hud-top">
  <button class="brand" id="brand" aria-label="Back to launch">
    <span class="n">AMISHA CHOUDHARY</span>
    <span class="r">DEVOPS &amp; CLOUD ENGINEER</span>
  </button>
  <nav class="topnav" id="topnav" aria-label="Sectors"><!-- built by JS --></nav>
  <div class="toputil">

function cvs(s,d){const c=document.createElement('canvas');c.width=c.height=s;d(c.getContext('2d'),s);return new THREE.CanvasTexture(c);}
function glow(a,b){return cvs(256,(x,s)=>{const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);g.addColorStop(0,a);g.addColorStop(.42,b);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,s,s);});}
const dot=cvs(64,(x,s)=>{const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);g.addColorStop(0,'#fff');g.addColorStop(.5,'rgba(255,255,255,.4)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,s,s);});
function planetTex(base,acc,band){return cvs(512,(x,s)=>{x.fillStyle=base;x.fillRect(0,0,s,s);
  if(band){for(let y=0;y<s;y+=6+Math.random()*20){x.globalAlpha=.1+Math.random()*.22;x.fillStyle=Math.random()>.5?acc:'rgba(0,0,0,.2)';x.fillRect(0,y,s,6+Math.random()*22);}}
  else{for(let i=0;i<80;i++){x.globalAlpha=.05+Math.random()*.15;x.fillStyle=Math.random()>.5?acc:'rgba(0,0,0,.45)';x.beginPath();x.ellipse(Math.random()*s,Math.random()*s,8+Math.random()*60,5+Math.random()*26,Math.random()*Math.PI,0,7);x.fill();}}x.globalAlpha=1;});}
function textSprite(text,size,color){
  const font=64,pad=24; const m=document.createElement('canvas').getContext('2d'); m.font=font+'px monospace';
  const w=Math.ceil(m.measureText(text).width);
  const c=document.createElement('canvas'); c.width=w+pad*2; c.height=font+pad*2; const x=c.getContext('2d');
  x.font=font+'px monospace'; x.textAlign='center'; x.textBaseline='middle';
  x.shadowColor=color; x.shadowBlur=18; x.fillStyle=color; x.fillText(text,c.width/2,c.height/2);
  const t=new THREE.CanvasTexture(c);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false,fog:false}));
  sp.scale.set((c.width/c.height)*size,size,1); return sp;
}

/* ---- starfield (ignores fog so it never fades) ---- */
function stars(count,spread,size,tint){
  const g=new THREE.BufferGeometry(),p=new Float32Array(count*3),col=new Float32Array(count*3),c=new THREE.Color();
  for(let i=0;i<count;i++){ // wide slab around the whole flight corridor
    p[i*3]=(Math.random()*2-1)*spread; p[i*3+1]=(Math.random()*2-1)*spread*0.5; p[i*3+2]=-Math.random()*1400+200;
    c.set(tint).multiplyScalar(.4+Math.random()*.6); col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b; }
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const pt=new THREE.Points(g,new THREE.PointsMaterial({size,map:dot,transparent:true,depthWrite:false,vertexColors:true,blending:THREE.AdditiveBlending,sizeAttenuation:true,fog:false}));
  scene.add(pt); return pt;
}

const camPos=V(0,0,0), lookPos=V(0,0,0), lookDir=V(0,0,0);
const craftPos=V(0,0,0), craftTan=V(0,0,0), tmpTan=V(0,0,0);
const DOWN=V(0,-1,0), beamDir=V(0,0,0), WORLDUP=V(0,1,0), _r=V(0,0,0), _u=V(0,0,0), _tmp=V(0,0,0), _alien=V(0,0,0);

/* shooting-star update: spawn across the current view, streak, fade, respawn.
   Uses the view basis (_r,_u,lookDir) computed in the frame loop. */
function updateMeteors(dt){
  const arr=mg.attributes.position.array, col=mg.attributes.color.array;
  for(let i=0;i<METN;i++){ const m=met[i];
    if(!m.active){ m.delay-=dt; if(m.delay<=0){
        m.active=true; m.max=0.7+Math.random()*0.8; m.life=m.max;
        const D=90+Math.random()*170, rx=(Math.random()*2-1)*95, ry=(Math.random()*2-1)*58;
        m.pos.copy(camPos).addScaledVector(lookDir,D).addScaledVector(_r,rx).addScaledVector(_u,ry);
        const ang=Math.random()*Math.PI*2, sp=75+Math.random()*95;
        m.vel.copy(_r).multiplyScalar(Math.cos(ang)*sp).addScaledVector(_u,Math.sin(ang)*sp).addScaledVector(lookDir,Math.random()*22-6);
    } }
    let hx=0,hy=0,hz=0,tx=0,ty=0,tz=0,f=0;
    if(m.active){ m.pos.addScaledVector(m.vel,dt); m.life-=dt; if(m.life<=0){ m.active=false; m.delay=1.6+Math.random()*5; }
      f=clamp(m.life/m.max,0,1)*clamp((m.max-m.life)/0.15,0,1);
      _tmp.copy(m.vel).multiplyScalar(-0.06);
      hx=m.pos.x;hy=m.pos.y;hz=m.pos.z; tx=hx+_tmp.x;ty=hy+_tmp.y;tz=hz+_tmp.z;
    }
    arr[i*6]=hx;arr[i*6+1]=hy;arr[i*6+2]=hz; arr[i*6+3]=tx;arr[i*6+4]=ty;arr[i*6+5]=tz;
    col[i*6]=f;col[i*6+1]=f;col[i*6+2]=f; col[i*6+3]=0;col[i*6+4]=0;col[i*6+5]=0;
  }
  mg.attributes.position.needsUpdate=true; mg.attributes.color.needsUpdate=true;
}

/* opening cinematic: craft flies in, then the name flashes */
let introActive=!R, introMsgShown=R, introStartTime=0, introT=1; const INTRO_DUR=2.3;
let emergeT=0; // captain emerges only after the UFO has arrived

function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,0.05); last=now; const t=now*0.001;

  prevP=P;
  if(R){ P=targetP; }
  else { P=lerp(P,targetP,0.055); if(Math.abs(targetP-P)<0.0004) P=targetP; }

  /* opening cinematic timing */
  introT=1;
  if(introActive){
    if(P>0.02){ introActive=false; }
    else if(introStartTime===0){ introT=0; }
    else { introT=clamp((now-introStartTime)/(INTRO_DUR*1000),0,1); if(introT>=1) introActive=false; }
  }
  if(introActive && !introMsgShown && introT>0.6){ introMsgShown=true; flash('rgba(126,231,255,.55)'); if(soundOn)Audio.arrive(); }

  if(!arrived && P>0.985){ arrived=true; flash('rgba(147,209,154,.5)'); if(soundOn)Audio.arrive(); }
  if(P<0.9) arrived=false;

  /* streaks fire on EVERY leg, driven purely by travel: 'transit' ramps up as you leave a
     sector and eases to ZERO at rest, plus a speed term — so all motion stops when parked. */
  const spd=Math.abs(P-prevP);
  const _fr=clamp(P,0,1)*(N-1), _dd=Math.abs(_fr-Math.round(_fr));
  const transit=smooth(clamp(_dd/0.28,0,1));
  const streakI=clamp(Math.max(transit, spd*100-0.03),0,1);
  // travel whoosh — once per transition
  if(!moveFired && streakI>0.4){ moveFired=true; if(soundOn)Audio.warp(1.0); }
  if(streakI<0.12) moveFired=false;

  /* camera & look, sampled by segment param so rests land on keyframes */
  camCurve.getPoint(clamp(P,0,1),camPos);
  lookCurve.getPoint(clamp(P,0,1),lookPos);
  camera.position.copy(camPos);
  camera.fov=lerp(camera.fov,60+streakI*16,0.12); camera.updateProjectionMatrix();
  // banking sway + a little high-frequency shake — turbulence on EVERY leg, not just the warp band
  const roll=streakI*(Math.sin(now*0.0062)*0.28 + Math.sin(now*0.017+0.7)*0.11 + Math.sin(now*0.043)*0.045);
  camera.up.set(Math.sin(roll),Math.cos(roll),0);
  camera.lookAt(lookPos);
  fill.position.copy(camPos);
  uFill.position.copy(camPos);

  lookDir.copy(lookPos).sub(camPos); if(lookDir.lengthSq()<1e-6) lookDir.set(0,0,-1); lookDir.normalize();
  _r.copy(lookDir).cross(WORLDUP); if(_r.lengthSq()<1e-6)_r.set(1,0,0); _r.normalize();
  _u.copy(_r).cross(lookDir).normalize();

  /* chase craft — flies the route just ahead of the camera, banking into turns (as before) */
  camCurve.getPoint(clamp(P+0.02,0,1),craftPos);
  camCurve.getTangent(clamp(P+0.02,0,1),craftTan);
  const leadD=craftPos.distanceTo(camPos);
  if(leadD<9) craftPos.addScaledVector(craftTan,9-leadD); // stay comfortably ahead, incl. the final stop
  /* at the opening, lift the craft ABOVE the message so it reads as a projector casting down */
  const titleF=smooth(clamp(1-P/0.05,0,1));
  const endF=smooth(clamp((P-0.93)/0.07,0,1));
  if(titleF>0.001){ _tmp.copy(camPos).addScaledVector(lookDir,18); _tmp.y+=6; craftPos.lerp(_tmp,titleF); }
  if(endF>0.001){ _tmp.copy(camPos).addScaledVector(lookDir,22); _tmp.y+=8.5; craftPos.lerp(_tmp,endF); }
  if(introActive){ // sweep in from far, upper-right, deep ahead
    const e=1-Math.pow(1-introT,3);
    const bx=craftPos.x,by=craftPos.y,bz=craftPos.z, ax=bx+46,ay=by+32,az=bz-84;
    craftPos.set(ax+(bx-ax)*e, ay+(by-ay)*e, az+(bz-az)*e);
  } else if(titleF<0.5 && endF<0.5){
    /* keep the craft in frame and leaning a little right — it keeps its natural (varied) spot
       and size, but is never allowed off the left edge (see sectors 2/4/5/6) */
    _tmp.copy(craftPos).sub(camPos);
    const d=Math.max(_tmp.dot(lookDir),4), th=Math.tan(camera.fov*Math.PI/360), hw=d*th*camera.aspect, hh=d*th;
    const rx=clamp(_tmp.dot(_r),0.1*hw,0.7*hw), ry=clamp(_tmp.dot(_u),-0.4*hh,0.66*hh);
    craftPos.copy(camPos).addScaledVector(lookDir,d).addScaledVector(_r,rx).addScaledVector(_u,ry);
  }
  craft.position.copy(craftPos);
  const heading=Math.atan2(craftTan.x,craftTan.z);
  camCurve.getTangent(clamp(P+0.04,0,1),tmpTan);
  const turn=tmpTan.x*craftTan.z - tmpTan.z*craftTan.x;
  craftBank=lerp(craftBank,clamp(-turn*4,-0.6,0.6),0.1);
  craft.rotation.set(0,heading+Math.PI,0);
  craft.rotateZ(craftBank);
  craft.rotateX(Math.sin(t*0.8)*0.05);
  if(introActive) craft.rotateZ(Math.sin(introT*Math.PI)*0.6*(1-introT));
  craftLights.rotation.y=t*1.2;
  if(craftAlien) craftAlien.lookAt(camPos); // the pilot keeps an eye on you

  /* the captain steps out of the UFO and waves — only AFTER the ship has arrived & settled */
  if(P>0.992) emergeT=Math.min(emergeT+dt/1.3,1); else emergeT=Math.max(emergeT-dt/0.5,0);
  if(fullAlien){
    const emerge=smooth(emergeT);
    fullAlien.visible=emerge>0.002;
    if(fullAlien.visible){
      fullAlien.scale.setScalar(emerge*1.4);
      _alien.copy(camPos).addScaledVector(lookDir,16); _alien.y+=5;
      fullAlien.position.copy(craftPos).lerp(_alien,emerge);
      fullAlien.position.y += Math.sin(now*0.002)*0.12; // gentle float
      fullAlien.lookAt(camPos);
      if(alienWave) alienWave.rotation.z=Math.sin(now*0.009)*0.55; // wave!
    }
    if(craftAlien) craftAlien.visible = emerge<0.4; // the dome empties once the captain is out
  }
  // bigger at the title; and grow as it approaches during the fly-in
  let cs=1+0.4*titleF;
  if(introActive) cs*=(0.35+0.65*(1-Math.pow(1-introT,3)));
  craft.scale.setScalar(cs);

  /* projection beam — on at the title, arriving with the intro message */
  let beamF=smooth(clamp(1-P/0.05,0,1));
  if(introActive) beamF*=smooth(clamp((introT-0.5)/0.32,0,1));
  beam.position.copy(craftPos); beamCore.position.copy(craftPos);
  beamDir.copy(lookPos).sub(craftPos); if(beamDir.lengthSq()<1e-6) beamDir.set(0,-1,0); beamDir.normalize();
  beam.quaternion.setFromUnitVectors(DOWN,beamDir); beamCore.quaternion.copy(beam.quaternion);
  beam.material.opacity=beamF*0.18; beamCore.material.opacity=beamF*0.32;

  /* shooting stars + subtle twinkle */
  updateMeteors(dt);
  starsB.material.opacity=0.78+Math.sin(t*1.4)*0.15;

  /* set pieces */
  for(let i=0;i<pieces.length;i++) pieces[i].update(t,dt);

  /* colour emerges only as you APPROACH a sector — the space between is dark.
     Uses the nearest sector's colour scaled by proximity, so mid-flight is neutral/dark. */
  const nsec=Math.round(clamp(P,0,1)*(N-1)), ddc=Math.abs(clamp(P,0,1)*(N-1)-nsec);
  const prox=smooth(clamp(1-ddc/0.3,0,1)); // 1 at a sector, →0 (dark) through the middle of each leg
  tmpCol.copy(ACT_COL[nsec]);
  moodMat.color.lerp(tmpCol,0.06);
  moodMat.opacity=0.03+0.32*prox; // glow nearly off in the dark between sectors
  moodNeb.position.set(camPos.x+lookDir.x*150,camPos.y+lookDir.y*150+6,camPos.z+lookDir.z*150);
  fogTmp.copy(tmpCol).multiplyScalar(0.12); darkCol.copy(FOGBASE).lerp(fogTmp,prox);
  sceneFog.color.lerp(darkCol,0.06);
  if(tintEl){ const gate=smooth(clamp((P-0.03)/0.10,0,1)); const ta=0.30*prox*gate;
    tintEl.style.setProperty('--tint','rgba('+(tmpCol.r*255|0)+','+(tmpCol.g*255|0)+','+(tmpCol.b*255|0)+','+ta.toFixed(3)+')'); }

  /* velocity- & warp-reactive streaks (heads rush toward camera) — on every transition */
  warpMat.opacity=streakI*0.95;
  const headSpeed=120+streakI*280, stretch=2+streakI*34;
  const wa=wg.attributes.position.array;
  for(let i=0;i<streakN;i++){ const b=wBase[i];
    b.z-=headSpeed*dt; if(b.z<-30){ b.z=170+Math.random()*40; const a=Math.random()*7,r=1.5+Math.random()*24; b.x=Math.cos(a)*r; b.y=Math.sin(a)*r*0.7; }
    const hx=camPos.x+_r.x*b.x+_u.x*b.y+lookDir.x*b.z, hy=camPos.y+_r.y*b.x+_u.y*b.y+lookDir.y*b.z, hz=camPos.z+_r.z*b.x+_u.z*b.y+lookDir.z*b.z;
    wa[i*6]=hx; wa[i*6+1]=hy; wa[i*6+2]=hz;
    wa[i*6+3]=hx+lookDir.x*stretch; wa[i*6+4]=hy+lookDir.y*stretch; wa[i*6+5]=hz+lookDir.z*stretch;
  }
  wg.attributes.position.needsUpdate=true;

  updateSections();
  renderer.render(scene,camera);
  uRenderer.render(uScene,camera);
}

/* ======================= BOOT ======================= */
readScroll();
requestAnimationFrame(frame);
let booted=false;
function boot(){ if(booted)return; booted=true; document.getElementById('loader').classList.add('done'); introStartTime=performance.now(); }
addEventListener('load',()=>setTimeout(boot,R?300:1800));
setTimeout(boot,3600);

</script>
</body>
